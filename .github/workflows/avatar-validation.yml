name: Avatar Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit containing the avatar pipeline
        required: true
        default: feature/v0.05-human-avatar
        type: string
      promote:
        description: Commit the validated USDZ to the avatar branch
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avatar-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Render and validate avatar
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, macOS, ARM64]
    environment: avatar-validation
    timeout-minutes: 15
    outputs:
      validated_sha: ${{ steps.revision.outputs.sha }}

    env:
      BLENDER_BIN: /Applications/Blender.app/Contents/MacOS/Blender
      OUTPUT_ROOT: ${{ github.workspace }}/.eidome-assets/generated/human-poc

    steps:
      - name: Check out selected avatar revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Capture validated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Blender installation
        run: |
          test -x "$BLENDER_BIN"
          "$BLENDER_BIN" --version

      - name: Generate known-good avatar
        run: |
          set -o pipefail
          bash tools/blender/build_human_poc.sh \
            --name "Amr" \
            --sex male \
            --age 40 \
            --height-cm 180 \
            --weight-kg 85 \
            --muscle 0.65 \
            --skin-query "male_bronze" \
            --clothes-query "male_swim_shorts1" \
            2>&1 | tee "$RUNNER_TEMP/eidome-avatar-build.log"

      - name: Validate artifacts and deformation
        run: |
          set -o pipefail
          "$BLENDER_BIN" \
            --background "$OUTPUT_ROOT/eidome-human-poc.blend" \
            --python-exit-code 1 \
            --python tools/blender/validate_human_poc.py \
            -- \
            --human-name "Amr" \
            --glb "$OUTPUT_ROOT/eidome-human-poc.glb" \
            --usdz "$OUTPUT_ROOT/eidome-human-poc.usdz" \
            --preview "$OUTPUT_ROOT/eidome-human-poc.png" \
            --report "$OUTPUT_ROOT/validation.json" \
            2>&1 | tee "$RUNNER_TEMP/eidome-avatar-validation.log"
          test -s "$OUTPUT_ROOT/validation.json"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidome-avatar-validation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .eidome-assets/generated/human-poc/eidome-human-poc.blend
            .eidome-assets/generated/human-poc/eidome-human-poc.glb
            .eidome-assets/generated/human-poc/eidome-human-poc.usdz
            .eidome-assets/generated/human-poc/eidome-human-poc.png
            .eidome-assets/generated/human-poc/validation.json
            ${{ runner.temp }}/eidome-avatar-build.log
            ${{ runner.temp }}/eidome-avatar-validation.log

  promote:
    name: Promote validated USDZ
    needs: validate
    if: ${{ inputs.promote && inputs.ref == 'feature/v0.05-human-avatar' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          fetch-depth: 0

      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: eidome-avatar-validation-${{ github.run_number }}
          path: avatar-artifact

      - name: Commit validated Apple asset
        run: |
          set -euo pipefail
          source_asset="$(find avatar-artifact -type f -name eidome-human-poc.usdz -print -quit)"
          test -n "$source_asset"
          test -s "$source_asset"
          mkdir -p Eidome/Resources/Models
          cp "$source_asset" Eidome/Resources/Models/eidome-human.usdz

          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Eidome/Resources/Models/eidome-human.usdz

          if git diff --cached --quiet; then
            echo "Validated USDZ is unchanged; nothing to promote."
            exit 0
          fi

          git commit -m "Add validated Eidome human asset"
          git push origin HEAD:refs/heads/feature/v0.05-human-avatar
