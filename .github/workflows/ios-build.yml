name: iOS Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "feature/**"]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and archive Eidome
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Validate review assets
        run: scripts/validate-review-readiness.sh

      - name: Debug simulator build
        run: |
          set -o pipefail
          xcodebuild \
            -project Eidome.xcodeproj \
            -scheme Eidome \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build | xcpretty

      - name: Release device archive
        run: |
          set -o pipefail
          xcodebuild \
            -project Eidome.xcodeproj \
            -scheme Eidome \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Eidome.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive | xcpretty

          test -d "$RUNNER_TEMP/Eidome.xcarchive/Products/Applications/Eidome.app"
